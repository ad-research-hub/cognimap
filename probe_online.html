var out = document.getElementById('out');
function log(s){ out.textContent += '\n' + s; }
var EP = 'https://cognimap-stats.app.workbuddy.host';
var PK = 'wbpk_WXXFMmxech78UdVaTcBMEO_b3MWAMJ0pGlXxX6541m9rLha8VDfL121';
var S = document.createElement('script');
S.src = 'https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';
S.onload = function(){
  log('SDK ok, origin=' + location.origin);
  var cloud = WorkBuddyCloud.createWorkBuddyCloud({endpoint: EP, publishableKey: PK});
  cloud.database.rpc('cm_stats', {p_days: 7, p_key: 'cgm-7f3a9e2d'})

      log('STATS err=' + JSON.stringify(r.error));

    })
    .then(function(r){
      log('TRACK err=' + JSON.stringify(r.error));
      log('TRACK data=' + JSON.stringify(r.data));
      document.title = 'DONE';
    })
    .catch(function(e){ log('CATCH=' + (e && e.message || e)); document.title = 'DONE'; });
